# GitHub Pages 자동 배포.
#
# 이건 "미리보기용" 배포다. 팀의 공식 배포는 Vercel로 한다. (팀 규칙 2번)
# main 브랜치에 병합되면 자동으로 빌드해서 GitHub Pages에 올린다.
#
# 처음 한 번은 GitHub 저장소 > Settings > Pages 에서
# "Source"를 "GitHub Actions"로 바꿔줘야 동작한다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # 프로젝트 저장소(user.github.io/repo-name)에서도 경로가 맞도록
      # 저장소 이름을 base 로 넣어 빌드한다. Vercel 배포에는 영향이 없다.
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
